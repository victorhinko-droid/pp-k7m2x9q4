<title>Пинг-понг для Нины</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Rubik:wght@600;800&display=swap">
<style>
/* Концепция: яркая игровая «книга-тетрадь» с лисёнком Пингом; цвет недели задаёт фаза курса */
:root {
  --bg: #F5F8FC; --surface: #FFFFFF; --surface2: #EAF0F8; --ink: #1B2B40; --muted: #5A6B80; --line: #D3DDEA;
  --accent: #F26B1D; --accent-ink: #FFFFFF; --good: #2E7D32; --warn: #B7791F; --bad: #C62828; --pc: #EF6C00;
  --shadow: 0 1px 2px rgba(20,40,70,.08), 0 6px 18px rgba(20,40,70,.06);
  --f-display: 'Rubik', 'Segoe UI', system-ui, sans-serif; --f-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121A26; --surface: #1B2636; --surface2: #243349; --ink: #EAF1FA; --muted: #A2B1C6; --line: #33445D;
  --accent: #FF8A4D; --accent-ink: #1B1209; --good: #7BD88F; --warn: #F0C36B; --bad: #FF8A80;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121A26; --surface: #1B2636; --surface2: #243349; --ink: #EAF1FA; --muted: #A2B1C6; --line: #33445D;
  --accent: #FF8A4D; --accent-ink: #1B1209; --good: #7BD88F; --warn: #F0C36B; --bad: #FF8A80;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.wrap > *, main > *, .hero > *, .day > * { min-width: 0; }
main { display: grid; gap: 14px; min-width: 0; }
.seg { max-width: 100%; }
.seg button { white-space: normal; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding-top: 18px; }
.top svg { display: block; height: 96px; width: auto; }
.top h1 { font-size: clamp(24px, 5vw, 38px); font-weight: 800; letter-spacing: -.01em; }
.top p { margin: 4px 0 0; color: var(--muted); }
.ring { text-align: center; font-family: var(--f-display); }
.ring b { display: block; font-size: 26px; }
.ring small { color: var(--muted); font-family: var(--f-body); font-size: 13px; }
.seg { display: inline-flex; background: var(--surface2); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 800; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 2px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 12px; font-weight: 800; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.weeks { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; }
.wk { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--pc); background: var(--surface);
  font: 800 18px var(--f-display); color: var(--ink); position: relative; scroll-snap-align: center; }
.wk[aria-current="true"] { background: var(--pc); color: #fff; }
.wk .done { position: absolute; right: -4px; top: -6px; font-size: 18px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
.card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; }
.hero { background: color-mix(in srgb, var(--pc) 13%, var(--surface)); border: 3px solid var(--pc); border-radius: 26px; padding: 18px;
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.pill { display: inline-block; background: var(--pc); color: #fff; font: 700 13px var(--f-display); padding: 4px 12px; border-radius: 999px; }
.hero h2 { font-size: clamp(28px, 6vw, 44px); color: color-mix(in srgb, var(--pc) 72%, var(--ink)); font-weight: 800; margin-top: 6px; }
.hero h3 { font-size: 20px; margin-top: 2px; }
.goal { margin-top: 8px; }
.bubble { position: relative; background: var(--surface); border: 3px solid var(--pc); border-radius: 18px; padding: 10px 14px; font-weight: 800; max-width: 330px; }
.bubble:after { content: ""; position: absolute; right: -10px; top: 50%; width: 14px; height: 14px; background: var(--surface);
  border-top: 3px solid var(--pc); border-right: 3px solid var(--pc); transform: translateY(-50%) rotate(45deg); }
.mascot { display: flex; align-items: center; gap: 18px; justify-content: flex-end; }
.day { display: grid; grid-template-columns: 64px 1fr 74px; gap: 12px; align-items: stretch; background: var(--surface); border-radius: 18px; padding: 12px;
  box-shadow: var(--shadow); border-left: 8px solid var(--pc); }
.day.today { outline: 3px solid var(--accent); }
.day.light, .day.rest { background: color-mix(in srgb, var(--pc) 10%, var(--surface)); }
.dn { font: 800 22px var(--f-display); color: color-mix(in srgb, var(--pc) 72%, var(--ink)); align-self: center; text-align: center; }
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; min-width: 0; }
.blk { background: var(--surface2); border: 0; border-radius: 12px; padding: 8px 10px; text-align: left; min-width: 0; overflow-wrap: anywhere; }
.blk small { display: block; font: 700 11px var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
.blk.tap { cursor: pointer; border: 2px solid transparent; }
.blk.tap:hover { border-color: var(--pc); }
.blk.tap span.more { color: var(--accent); font-weight: 800; }
.stwrap { display: grid; place-items: center; }
.star { width: 62px; height: 62px; border-radius: 50%; border: 3px dashed var(--pc); background: var(--surface); display: grid; place-items: center; padding: 0; }
.star svg { width: 40px; height: 40px; }
.star[aria-pressed="true"] { background: #FFE082; border-style: solid; }

нка</td><td>Лифт: 5 серий</td><td>Цветные дорожки: 10 мячей</td><td>Праздник</td></tr><tr><th>Сб</th><td>Зоопарк, Растяжка-сказка</td><td>Мини-проверка: Мишени, Падающий мяч</td><td>Свободная игра за столом, Нина придумывает правила</td><td>Дневник чемпионки</td></tr><tr><th>Вс</th><td colspan="4">Отдых! Прогулка, бассейн или самокат. Мячик тоже отдыхает.</td></tr></table></div><p><i>Мячик пошёл на красный, но свернул на зелёный: так интереснее!</i></p></details><details><summary><b>Неделя 16. Длинная песенка</b></summary><p><b>Задание:</b> «Длинная песенка» 8 ударов вместе, «Мишени» 5 из 10</p><div class="sc"><table><tr><th></th><th>Разминка 5 мин</th><th>Игра 1 · 8 мин</th><th>Игра 2 · 8 мин</th><th>Финал 4 мин</th></tr><tr><th>Пн</th><td>Мельница, Шаг-приставка</td><td>Длинная песенка: 5 попыток, запиши лучшую</td><td>Мишени: 10 мячей</td><td>Праздник</td></tr><tr><th>Вт</th><td>Ловкая помощница, Тропинка</td><td>Двойной лифт: 5 серий</td><td>Подача с ракетки: 10 попыток</td><td>Праздник</td></tr><tr><th>Ср</th><td colspan="4"><i>Лёгкий день, 15 минут:</i> Мельница, Шаг-приставка, Ловкая помощница, Растяжка-сказка, Ловец</td></tr><tr><th>Чт</th><td>Мельница, Шаг-приставка</td><td>Длинная песенка: 5 попыток</td><td>Падающий мяч: 10 попыток</td><td>Праздник</td></tr><tr><th>Пт</th><td>Ловкая помощница, Тропинка</td><td>Стена-эхо: 5 попыток</td><td>Длинная песенка: 5 попыток</td><td>Праздник</td></tr><tr><th>Сб</th><td>Зоопарк, Растяжка-сказка</td><td>Тест недели (см. таблицу рекордов)</td><td>Свободная игра за столом, Нина придумывает правила</td><td>Дневник чемпионки</td></tr><tr><th>Вс</th><td colspan="4">Отдых! Прогулка, бассейн или самокат. Мячик тоже отдыхает.</td></tr></table></div><p><i>Пинг считал удары до 20 и перепутал с 12. Зато весело!</i></p></details><details><summary><b>Неделя 17. Ближний и дальний</b></summary><p><b>Задание:</b> «Ближний и дальний» 6 из 10, «Длинная песенка» 10 ударов</p><div class="sc"><table><tr><th></th><th>Разминка 5 мин</th><th>Игра 1 · 8 мин</th><th>Игра 2 · 8 мин</th><th>Финал 4 мин</th></tr><tr><th>Пн</th><td>Мельница, Шаг-приставка</td><td>Длинная песенка: 5 попыток</td><td>Ближний и дальний: 10 мячей, 2 подхода</td><td>Праздник</td></tr><tr><th>Вт</th><td>Ловкая помощница, Тропинка</td><td>Двойной лифт: 5 серий</td><td>Падающий мяч: 10 попыток</td><td>Праздник</td></tr><tr><th>Ср</th><td colspan="4"><i>Лёгкий день, 15 минут:</i> Мельница, Шаг-приставка, Ловкая помощница, Растяжка-сказка, Ловец</td></tr><tr><th>Чт</th><td>Мельница, Шаг-приставка</td><td>Ближний и дальний: 10 мячей, 2 подхода</td><td>Мишени: 10 мячей</td><td>Праздник</td></tr><tr><th>Пт</th><td>Ловкая помощница, Тропинка</td><td>Стена-эхо: 5 попыток</td><td>Меткая подача: 10 попыток</td><td>Праздник</td></tr><tr><th>Сб</th><td>Зоопарк, Растяжка-сказка</td><td>Мини-проверка: Песенка, Ближний и дальний</td><td>Свободная игра за столом, Нина придумывает правила</td><td>Дневник чемпионки</td></tr><tr><th>Вс</th><td colspan="4">Отдых! Прогулка, бассейн или самокат. Мячик тоже отдыхает.</td></tr></table></div><p><i>Мяч просил у стола: «Дай мне ближний путь!» Стол: «Это же сетка».</i></p></details><details><summary><b>Неделя 18. Тихий мячик</b></summary><p><b>Задание:</b> «Тихий мячик» 4 из 10, «Длинная песенка» 10–12 ударов</p><div class="sc"><table><tr><th></th><th>Разминка 5 мин</th><th>Игра 1 · 8 мин</th><th>Игра 2 · 8 мин</th><th>Финал 4 мин</th></tr><tr><th>Пн</th><td>Мельница, Шаг-приставка</td><td>Длинная песенка: 5 попыток</td><td>Тихий мячик: 10 мячей, 2 подхода</td><td>Праздник</td></tr><tr><th>Вт</th><td>Ловкая помощница, Тропинка</td><td>Двойной лифт: 5 серий</td><td>Меткая подача: 10 попыток</td><td>Праздник</td></tr><tr><th>Ср</th><td colspan="4"><i>Лёгкий день, 15 минут:</i> Мельница, Шаг-приставка, Ловкая помощница, Растяжка-сказка, Ловец</td></tr><tr><th>Чт</th><td>Мельница, Шаг-приставка</td><td>Ближний и дальний: 10 мячей</td><td>Тихий мячик: 10 мячей</td><td>Праздник</td></tr><tr><th>Пт</th><td>Ловкая пом ов</p><div class="sc"><table><tr><th></th><th>Разминка 5 мин</th><th>Игра 1 · 8 мин</th><th>Игра 2 · 8 мин</th><th>Финал 4 мин</th></tr><tr><th>Пн</th><td>Шаг-приставка, Светофор</td><td>Подача в угол: 10 попыток, 2 подхода</td><td>Длинная песенка: 5 попыток</td><td>Праздник</td></tr><tr><th>Вт</th><td>Ловкая помощница, Тропинка</td><td>Двойной лифт: 5 серий</td><td>Ловим подачу: 5 попыток</td><td>Праздник</td></tr><tr><th>Ср</th><td colspan="4"><i>Лёгкий день, 15 минут:</i> Мельница, Шаг-приставка, Ловкая помощница, Растяжка-сказка, Ловец</td></tr><tr><th>Чт</th><td>Шаг-приставка, Светофор</td><td>Подача в угол: 10 попыток</td><td>Мишени: 10 мячей</td><td>Праздник</td></tr><tr><th>Пт</th><td>Ловкая помощница, Тропинка</td><td>Стена-эхо: 5 попыток</td><td>Длинная песенка с шагом: 5 попыток</td><td>Праздник</td></tr><tr><th>Сб</th><td>Зоопарк, Растяжка-сказка</td><td>Тест недели (см. таблицу рекордов)</td><td>Свободная игра за столом, Нина придумывает правила</td><td>Дневник чемпионки</td></tr><tr><th>Вс</th><td colspan="4">Отдых! Прогулка, бассейн или самокат. Мячик тоже отдыхает.</td></tr></table></div><p><i>Подача в угол: мячик ехал в синий угол, а приехал в красный. Бывает!</i></p></details><details><summary><b>Неделя 21. Подача-сюрприз</b></summary><p><b>Задание:</b> «Подача-сюрприз» 5 из 10, «Песенка с шагом» 8 ударов</p><div class="sc"><table><tr><th></th><th>Разминка 5 мин</th><th>Игра 1 · 8 мин</th><th>Игра 2 · 8 мин</th><th>Финал 4 мин</th></tr><tr><th>Пн</th><td>Шаг-приставка, Светофор</td><td>Подача-сюрприз: 10 попыток</td><td>Длинная песенка: 5 попыток</td><td>Праздник</td></tr><tr><th>Вт</th><td>Ловкая помощница, Тропинка</td><td>Подача в угол: 10 попыток</td><td>Тихий мячик: 10 мячей</td><td>Праздник</td></tr><tr><th>Ср</th><td colspan="4"><i>Лёгкий день, 15 минут:</i> Мельница, Шаг-приставка, Ловкая помощница, Растяжка-сказка, Ловец</td></tr><tr><th>Чт</th><td>Шаг-приставка, Светофор</td><td>Подача-сюрприз: 10 попыток</td><td>Ловим подачу: 5 попыток</td><td>Праздник</td></tr><tr><th>Пт</th><td>Ловкая помощница, Тропинка</td><td>Стена-эхо: 5 попыток</td><td>Длинная песенка с шагом: 5 попыток</td><td>Праздник</td></tr><tr><th>Сб</th><td>Зоопарк, Растяжка-сказка</td><td>Мини-проверка: Подача в угол, Подача-сюрприз</td><td>Свободная игра за столом, Нина придумывает правила</td><td>Дневник чемпионки</td></tr><tr><th>Вс</th><td colspan="4">Отдых! Прогулка, бассейн или самокат. Мячик тоже отдыхает.</td></tr></table></div><p><i>Сюрприз! Мячик сам удивился, куда он упал.</i></p></details><details><summary><b>Неделя 22. Игра до 11</b></summary><p><b>Задание:</b> сыграть игру до 7 очков со счётом и сменой подач</p><div class="sc"><table><tr><th></th><th>Разминка 5 мин</th><th>Игра 1 · 8 мин</th><th>Игра 2 · 8 мин</th><th>Финал 4 мин</th></tr><tr><th>Пн</th><td>Шаг-приставка, Светофор</td><td>Счёт и подача: 10 розыгрышей с подачей</td><td>Длинная песенка: 5 попыток</td><td>Праздник</td></tr><tr><th>Вт</th><td>Ловкая помощница, Тропинка</td><td>Игра с очками: игра до 7 очков</td><td>Подача в угол: 5 попыток</td><td>Праздник</td></tr><tr><th>Ср</th><td colspan="4"><i>Лёгкий день, 15 минут:</i> Мельница, Шаг-приставка, Ловкая помощница, Растяжка-сказка, Ловец</td></tr><tr><th>Чт</th><td>Шаг-приставка, Светофор</td><td>Счёт и подача: 10 розыгрышей с подачей</td><td>Тихий мячик: 10 мячей</td><td>Праздник</td></tr><tr><th>Пт</th><td>Ловкая помощница, Тропинка</td><td>Игра с очками: игра до 7 очков</td><td>Стена-эхо: 5 попыток</td><td>Праздник</td></tr><tr><th>Сб</th><td>Зоопарк, Растяжка-сказка</td><td>Игра с очками: игра до 11 очков</td><td>Свободная игра за столом</td><td>Дневник чемпионки</td></tr><tr><th>Вс</th><td colspan="4">Отдых! Прогулка, бассейн или самокат. Мячик тоже отдыхает.</td></tr></table></div><p><i>Одиннадцать очков это как одиннадцать конфет, только слаще.</i></p></details><details><summary><b>Неделя 23. Карточки героя</b></summary><p><b>Задание:</b> выполнить 2 карточки героя, сыграть игру до 11 очков</p><div class="sc"><table><tr><th></th><th>Разминка 5 мин</th><th>Игра 1 · 8 мин</th><th>Игра 2 · 8 мин</th><th>Финал 4 мин</th></tr><tr><th>Пн</th><td>Шаг-приставка, Светофор</td><td>Игра с очками: игра до 7 очков</td><td>Подача-сюрприз: 10 попыток</td><td>Праздник</td></tr><tr><th>Вт</th><td>Ловкая помощница, Тропинка</td><td>Ближний и дальний и Тихий мячик: по 10 мячей</td><td>Счёт и подача: 10 розыгрышей с подачей</td><td>Праздник</td></tr><tr><th>Ср</th><td colspan="4"><i>Лёгкий день, 15 минут:</i> Мельница, Шаг-приставка, Ловкая помощница, Растяжка-сказка, Ловец</td></tr><tr><th>Чт</th><td>Шаг-приставка, Светофор</td><td>Игра с очками: игра до 11 очков</td><td>Подача в угол: 5 попыток</td><td>Праздник</td></tr><tr><th>Пт</th><td>Ловкая помощница, Тропинка</td><td>Длинная песенка: 5 попыток</td><td>Игра с очками: игра до 7 очков</td><td>Праздник</td></tr><tr><th>Сб</th><td>Зоопарк, Растяжка-сказка</td><td>Мини-проверка: Песенка, Подача в угол, Игра до 11</td><td>Свободная игра за столом, Нина придумывает правила</td><td>Дневник чемпионки</td></tr><tr><th>Вс</th><td colspan="4">Отдых! Прогулка, бассейн или самокат. Мячик тоже отдыхает.</td></tr></table></div><p><i>Карточка сказала: «Улыбнись». Нина ответила: «Уже улыбаюсь!»</i></p></details><details><summary><b>Неделя 24. Большой турнир</b></summary><p><b>Задание:</b> сыграть настоящий турнир: 3 игры по 7 очков</p><div class="sc"><table><tr><th></th><th>Разминка 5 мин</th><th>Игра 1 · 8 мин</th><th>Игра 2 · 8 мин</th><th>Финал 4 мин</th></tr><tr><th>Пн</th><td>Шаг-приставка, Светофор</td><td>Игра с очками: игра до 11 очков</td><td>Подача в угол, Подача-сюрприз: по 5 попыток</td><td>Праздник</td></tr><tr><th>Вт</th><td>Ловкая помощница, Тропинка</td><td>Длинная песенка: 5 попыток</td><td>Игра с очками: игра до 7 очков</td><td>Праздник</td></tr><tr><th>Ср</th><td colspan="4"><i>Лёгкий день, 15 минут:</i> Мельница, Шаг-приставка, Ловкая помощница, Растяжка-сказка, Ловец</td></tr><tr><th>Чт</th><td>Шаг-приставка, Светофор</td><td>Игра с очками: игра до 11 очков</td><td>Счёт и подача: 10 розыгрышей с подачей</td><td>Праздник</td></tr><tr><th>Пт</th><td>Мельница, Светофор</td><td>Длинная песенка: 5 попыток</td><td>Репетиция турнира: игра до 7 очков</td><td>Праздник</td></tr><tr><th>Сб</th><td>Зоопарк, Растяжка-сказка</td><td>Тест недели (см. таблицу рекордов)</td><td>Турнир чемпионки: 3 игры по 7 очков</td><td>Дневник чемпионки</td></tr><tr><th>Вс</th><td colspan="4">Отдых! Прогулка, бассейн или самокат. Мячик тоже отдыхает.</td></tr></table></div><p><i>Поздравляем, Нина! Даже Сова Мудрая сказала «ух ты!»</i></p></details><h2>Игры: как играть</h2><details><summary><b>Зоопарк</b> · Разминка (код Р1)</summary><p><b>Зачем:</b> разогреть тело и потренировать равновесие.</p><p><b>Приготовьте:</b> Свободное место 3 на 3 метра. Стол или стул, за который можно держаться.</p><ol><li>Цапля. Нина стоит рядом со столом и держится за край рукой, которой удобно. Поднимает одну ногу и стоит на другой, вы вслух считаете до 10. Потом меняет ногу. На правой (слабой) ноге начните с 3–5 секунд и добавляйте по секунде в неделю.</li><li>Краб. Нина идёт боком вдоль длинного края стола: 5 шагов вправо, 5 шагов влево, колени чуть согнуты.</li><li>Пружинки. Нина стоит у стола и держится за край. Мягко приседает (колени чуть сгибаются, пятки остаются на полу) и выпрямляется, как пружинка, 5 раз. Потом 5 раз мягко поднимается на носочки. Никаких прыжков: слабую стопу не подворачиваем.</li><li>Слон. Идём медленно, с широкими шагами, руки как хобот. Правая рука делает только то, что у неё получается, без усилий.</li><li>На каждое «животное» уходит около 30 секунд. Рычим, трубим, смешим друг друга.</li></ol><p><b>Что считаем:</b> Ничего, главное весело и безопасно.</p><p><b>Если не получается:</b> Держаться за стол обеими руками, пружинки делать неглубоко, цаплю делать у стены.</p><p><b>Если слишком легко:</b> Цапля с мячом, лежащим на ракетке.</p><p><b>Следите:</b> Пол не скользкий, взрослый стоит рядом, но не хватает за руку внезапно.</p></details><details><summary><b>Ловкая помощница</b> · Разминка (код Р2)</summary><p><b>Зачем:</b> научить правую руку брать и отпускать: это основа подачи.</p><p><b>Приготовьте:</b> Две миски, 10 шариков или помпонов, мягкий мячик-антистресс, один стаканчик.</p><ol><li>Шарики. Поставьте две миски рядом на стол, в одной 10 шариков. Нина берёт правой рукой по одному шарику и перекладывает в пустую миску. Если не получается, подождите 5 секунд, потом помогите левой рукой. Не торопите.</li><li>Сжимаем. Нина сжимает мягкий мячик правой рукой и отпускает, 10 раз. Считайте вместе.</li><li>Пуск! Нина берёт мячик правой рукой, держит его над стаканчиком на высоте своей ладони и по команде «пуск!» раскрывает пальцы. Мячик должен упасть в стаканчик.</li></ol><p><b>Что считаем:</b> Сколько шариков переложено за минуту. Запишите и сравнивайте с прошлой неделей.</p><p><b>Если не получается:</b> Взять предметы побольше: кубики, мягкие игрушки.</p><p><b>Если слишком легко:</b> Предметы поменьше, на время «против себя вчерашней».</p><p><b>Следите:</b> Не превращайте игру в гонку с кем-то. При усталости или боли сразу стоп (светофор). Упражнения для правой руки согласуйте с физиотерапевтом.</p></details><details><summary><b>Растяжка-сказка</b> · Разминка (код Р3)</summary><p><b>Зачем:</b> снять скованность и подготовить мышцы.</p><p><b>Приготовьте:</b> Коврик или ковёр. Упражнения, которые показал физиотерапевт (спросите его заранее).</p><ol><li>Попросите физиотерапевта показать 3–4 растяжки для плеча, кисти и голеностопа и впишите их в таблицу ниже.</li><li>Нина садится или ложится удобно. Вы рассказываете короткую сказку (2 минуты), а она в это время делает по одной растяжке по 20–30 секунд.</li><li>Дышим спокойно: вдох через нос, выдох через рот. Тянем мягко, как резиночку, без боли и рывков.</li></ol><p><b>Что считаем:</b> Ничего. Следите, чтобы дыхание было ровным.</p><p><b>Если не получается:</b> Делать растяжку лёжа, с опорой на подушку.</p><p><b>Если слишком легко:</b> Увеличить время до 30 секунд.</p><p><b>Следите:</b> Боль или дрожь это сигнал остановиться. Растягиваем только то, что разрешил врач.</p></details><details><summary><b>Светофор</b> · Разминка (код Р4)</summary><p><b>Зачем:</b> научить стоять в «стойке готовности» и быстро реагировать.</p><p><b>Приготовьте:</b> Комната без препятствий, ракетка в руках у Нины.</p><ol><li>Объясните: «Зелёный» это идём, «красный» это замираем.</li><li>Нина ходит по комнате (на «зелёный» можно даже бегать трусцой).</li><li>Вы вдруг говорите «Красный!». Нина замирает в стойке: ноги чуть шире плеч, колени мягко согнуты (как будто садится на маленький стульчик), вес на носках, ракетка перед собой на уровне пояса.</li><li>Скажите «Зелёный!» и идём дальше. Всего 10–12 команд, меняйте их неожиданно.</li></ol><p><b>Что считаем:</b> Можно считать «раз, два» вслух, сколько секунд она стоит красиво.</p><p><b>Если не получается:</b> Идти медленно, давать команду и голосом, и жестом.</p><p><b>Если слишком легко:</b> На «красный» ещё лови мячик, который я качу по полу.</p><p><b>Следите:</b> Пол нескользкий, вокруг нет острых углов.</p></details><details><summary><b>Официант</b> · Мяч и ракетка (код М1)</summary><p><b>Зачем:</b> привыкнуть к ракетке и чувствовать мяч.</p><p><b>Приготовьте:</b> Ракетка, один мячик, 4–5 подушек или пластиковых кеглей.</p><ol><li>Разложите подушки по комнате зигзагом.</li><li>Положите мячик на ракетку, на плоскую часть. Нина держит ракетку в левой руке на уровне пояса, как официант с подносом.</li><li>Нина идёт по комнате и обходит все подушки. Это один круг. Мячик упал: «Официанты тоже роняют!», подобрали и пошли дальше.</li><li>Ракетка всегда в левой (сильной) руке. Правая рука главная помощница: ей можно просто придерживать подушки и подбирать упавший мячик с пола.</li></ol><p><b>Что считаем:</b> Сколько кругов без падения мяча.</p><p><b>Если не получается:</b> Мячик побольше или мягкий, подушки ближе. Положить мячик в маленькую чашку на ракетке.</p><p><b>Если слишком легко:</b> Идти быстрее, подушки ближе друг к другу. По желанию и если получается: правой рукой нести лёгкую пластиковую тарелочку.</p><p><b>Следите:</b> Нет ступенек и порогов на пути, мячи на полу собираем сразу.</p></details><details><summary><b>Лифт</b> · Мяч и ракетка (код М2)</summary><p><b>Зачем:</b> научиться контролировать мяч ракеткой.</p><p><b>Приготовьте:</b> Ракетка, один мячик.</p><ol><li>Нина кладёт мячик на ракетку, красной стороной вверх. Держит ракетку перед собой, как тарелку.</li><li>Лёгким движением ракетки вверх («как лифт едет») подбрасывает мячик на 10–15 сантиметров, не выше ладони.</li><li>Ловит его той же ракеткой и снова подбрасывает. Мячик не должен уходить в сторону.</li><li>Считаем подбрасывания подряд, пока мячик не упал. Это одна попытка. Всего 5 попыток, записываем лучшую.</li></ol><p><b>Что считаем:</b> Лучшая серия из 5 попыток (на неделе 1 цель: 3 подряд).</p><p><b>Если не получается:</b> Не подбивать, а подбросить и поймать на ракетку. Взять крупный или мягкий мяч.</p><p><b>Если слишком легко:</b> Подбивать на 15–20 сантиметров. Чередовать стороны ракетки.</p><p><b>Следите:</b> Следите, чтобы мячик летел подальше от лица. Хвалите за каждый лишний раз.</p></details><details><summary><b>Стена-эхо</b> · Мяч и ракетка (код М3)</summary><p><b>Зачем:</b> повторять удар без партнёра, можно играть одной.</p><p><b>Приготовьте:</b> Пустая стена без окон и зеркал. Ракетка, воздушный шарик или поролоновый мяч, потом обычный мячик. Мягкий пол или ковёр.</p><ol><li>Нина стоит в одном метре от стены. Можно приклеить к стене на уровне пояса бумажный круг-мишень.</li><li>Сначала играем воздушным шариком или поролоновым мячом. Нина лёгко бьёт левой ракеткой в стену, шарик медленно летит обратно, и она бьёт снова. Мяч не успевает улететь, и на неё хватает времени.</li><li>Когда это получается, берём обычный мячик и играем циклом: удар в стену, мяч упал, Нина берёт его правой рукой (держать и отпускать правой руке удобнее), говорит «пуск!» и отпускает мячик перед собой, бьёт левой ракеткой после отскока. Так у неё всегда есть время подойти к мячу.</li><li>Считаем, сколько ударов в стену получилось подряд. Всего 5 попыток.</li></ol><p><b>Что считаем:</b> Лучшая серия ударов из 5 попыток.</p><p><b>Если не получается:</b> Встать ближе, играть только шариком или поролоновым мячом. Мяч после стены всегда берём рукой и начинаем заново.</p><p><b>Если слишком легко:</b> Отойти на 1,5 метра. Бить в мишень. Постепенно переходить от цикла к настоящему отскоку мяча от пола.</p><p><b>Следите:</b> Рядом с мишенью нет ничего хрупкого. Мяч от стены летит быстро и непредсказуемо: не требуйте бегать за ним. Не требуйте «красивого» удара.</p></details><details><summary><b>Ловец</b> · Мяч и ракетка (код М4)</summary><p><b>Зачем:</b> тренировать реакцию левой рукой и спокойный захват правой.</p><p><b>Приготовьте:</b> Воздушный шарик, мягкий поролоновый мячик, ровный пол или стол.</p><ol><li>Левая рука ловит. Вы встаёте в 1,5–2 метрах от Нины и мягко бросаете воздушный шарик или мягкий мячик снизу, чтобы он летел медленно. Нина ловит левой рукой или обеими руками, прижимая к груди.</li><li>Правая рука останавливает. Вы катите мягкий мячик по полу или по столу очень медленно. Нина накрывает его правой ладонью и останавливает, потом берёт и держит 3 секунды. Ловить правой рукой на лету не нужно.</li><li>Воздушный шарик двумя руками. Вы подбрасываете шарик, Нина ловит его обеими руками и прижимает к груди: правая рука помогает прижать.</li><li>По 5–10 повторений на каждое задание.</li></ol><p><b>Что считаем:</b> Левой: сколько поймала из 10. Правой: сколько катящихся мячей остановила из 10.</p><p><b>Если не получается:</b> Воздушный шарик вместо мяча, расстояние 1 метр, мяч катится совсем медленно. Левая рука помогает правой.</p><p><b>Если слишком легко:</b> Левой ловить с хлопком в ладоши. Мяч катить чуть быстрее. Остановленный мяч правой рукой класть в стаканчик.</p><p><b>Следите:</b> Правая рука не обязана ловить на лету. Не требуйте этого, особенно если она устала. Не бросайте мяч в лицо.</p></details><details><summary><b>Гости</b> · За столом (код С1)</summary><p><b>Зачем:</b> научиться возвращать мяч на стол.</p><p><b>Приготовьте:</b> Стол с сеткой, ракетка у Нины, корзина или коробка с мячами на вашем краю стола.</p><ol><li>Нина стоит у короткого края стола, в шаге от него, в стойке: колени мягкие, ракетка перед собой.</li><li>Вы стоите напротив и мягко подаёте мяч: подбрасываете снизу так, чтобы он один раз ударился о стол на её половине (в самом простом варианте вы просто бросаете мяч прямо на её половину) и летел ей навстречу медленно и невысоко.</li><li>Нина толкает мяч ракеткой вперёд, как будто здоровается с ним. Техника не важна, важно попасть по мячу.</li><li>10 мячей это один подход. Потом пауза 30 секунд. Всего 2–3 подхода.</li></ol><p><b>Что считаем:</b> Сколько из 10 мячей вернулось на вашу половину стола.</p><p><b>Если не получается:</b> Подавать ближе к ракетке, мячи покрупнее, ещё медленнее.</p><p><b>Если слишком легко:</b> Подавать чуть быстрее и в разные места.</p><p><b>Следите:</b> Мячи с пола собираем только в паузах и вместе, не бегаем за ними во время игры, иначе можно поскользнуться.</p></details><details><summary><b>Ворота</b> · За столом (код С2)</summary><p><b>Зачем:</b> научиться прицеливаться.</p><p><b>Приготовьте:</b> Стол с сеткой, два пластиковых стакана (или коробка), мячи.</p><ol><li>Поставьте два стакана на вашу половину стола на расстоянии 20–25 сантиметров друг от друга. Это ворота.</li><li>Подавайте мячи, как в игре «Гости».</li><li>Нина старается вернуть мячик так, чтобы он попал в ворота. Пролетел между стаканами: 2 очка. Просто попал на стол: 1 очко.</li><li>10 мячей, считаем очки вместе.</li></ol><p><b>Что считаем:</b> Очки за 10 мячей (максимум 20).</p><p><b>Если не получается:</b> Ворота шире, вместо стаканов коробка.</p><p><b>Если слишком легко:</b> Ворота уже, стаканы ближе к сетке или дальше от неё.</p><p><b>Следите:</b> Стаканы лёгкие, пластиковые. Опрокинутый стакан не повод расстраиваться.</p></details><details><summary><b>Цветные дорожки</b> · За столом (код С3)</summary><p><b>Зачем:</b> научиться направлять мяч влево, в центр и вправо.</p><p><b>Приготовьте:</b> Стол с сеткой, три цветных листа бумаги (красный, жёлтый, зелёный) или цветная лента, мячи.</p><ol><li>Положите листы на вашу половину стола: один слева, один по центру, один справа.</li><li>Перед каждым мячом называете цвет: «Зелёный!» (и показываете пальцем).</li><li>Нина старается вернуть мячик на этот цвет.</li><li>10 мячей. Первые недели достаточно двух цветов (левый и правый), потом добавьте третий.</li></ol><p><b>Что считаем:</b> Сколько мячей из 10 попало на названный цвет.</p><p><b>Если не получается:</b> Один цвет на весь подход, называть цвет заранее.</p><p><b>Если слишком легко:</b> Называть цвет, когда мячик уже летит.</p><p><b>Следите:</b> Подавайте мячи в одно и то же место, меняется только цель.</p></details><details><summary><b>Корзина</b> · За столом (код С4)</summary><p><b>Зачем:</b> повторять один и тот же удар, пока он не станет привычным.</p><p><b>Приготовьте:</b> Корзина или коробка с 50–100 мячами, стол, ракетка.</p><ol><li>Поставьте корзину на ваш край стола, рядом с вами.</li><li>Берёте мячи по одному и подаёте через каждые 3 секунды. Считайте вслух «раз, два, три»: на «три» подаёте мяч.</li><li>Нина бьёт каждый мяч одним и тем же ударом: «толкаем вперёд, как здороваемся».</li><li>10–15 мячей это один подход. Пауза минуту. После двух подходов вместе собираем мячи.</li></ol><p><b>Что считаем:</b> Сколько мячей из 10 попало на стол.</p><p><b>Если не получается:</b> Подавать каждые 5 секунд.</p><p><b>Если слишком легко:</b> Подавать каждые 2 секунды.</p><p><b>Следите:</b> Ритм одинаковый, подавать в одну и ту же точку. Хвалите за ритм.</p></details><details><summary><b>Щит</b> · За столом (код С5)</summary><p><b>Зачем:</b> научиться блокировать мяч без замаха.</p><p><b>Приготовьте:</b> Стол, ракетка, мячи.</p><ol><li>Нина встаёт в стойку: ракетка перед собой на уровне пояса. Наклоните её немного вперёд, как крышу дома. Замахиваться не нужно.</li><li>Вы мягко отправляете мяч прямо на её ракетку.</li><li>Мяч должен отскочить от ракетки и перелететь на вашу половину стола.</li><li>Подсказка: если мяч улетает вверх, наклоните «крышу» ниже. Если мяч идёт в сетку, приподнимите «крышу».</li></ol><p><b>Что считаем:</b> Сколько из 10 мячей вернулось на стол.</p><p><b>Если не получается:</b> Подавать ближе и медленнее.</p><p><b>Если слишком легко:</b> Подавать быстрее и в разные стороны.</p><p><b>Следите:</b> Не требуйте замаха, ракетка просто стоит. Хвалите за каждый точный угол.</p></details><details><summary><b>Тик-так</b> · За столом (код С6)</summary><p><b>Зачем:</b> научиться играть розыгрыш.</p><p><b>Приготовьте:</b> Стол, ракетка, мячи.</p><ol><li>Договоритесь: вы и Нина играете мячом туда-сюда, как маятник. Мячу разрешён один отскок на каждой половине.</li><li>Первый мяч вы мягко подаёте Нине.</li><li>Каждый старается вернуть мяч мягко. Вы играете намного слабее и медленнее, как большой медведь с маленьким зайчонком.</li><li>Считаем вслух удары Нины. Всего 5 попыток, записываем лучшую серию.</li></ol><p><b>Что считаем:</b> Лучшая серия ударов Нины из 5 попыток.</p><p><b>Если не получается:</b> После каждого удара Нина ловит мяч рукой и снова начинает. Это «тик-так с паузой».</p><p><b>Если слишком легко:</b> Играть по диагонали и по прямой.</p><p><b>Следите:</b> Играйте намного слабее, иначе серия не получится.</p></details><details><summary><b>Мини-матч</b> · За столом (код С7)</summary><p><b>Зачем:</b> попробовать настоящую игру.</p><p><b>Приготовьте:</b> Стол, ракетка, мячи, листок для счёта.</p><ol><li>Договоритесь: игра идёт до 5 очков (на 9-й неделе до 3).</li><li>Подача по очереди: два раза подаёт Нина, два раза вы. Если подача не получилась, повторите без штрафа.</li><li>Очко получает тот, кто выиграл розыгрыш. Если Нина попала в ворота, ей 2 очка.</li><li>После матча пожмите друг другу руки, скажите «спасибо» мячу и станцуйте танец победителя.</li></ol><p><b>Что считаем:</b> Счёт матча. Не больше двух матчей за занятие.</p><p><b>Если не получается:</b> Вы иногда «проигрываете», у Нины всегда есть шанс на реванш.</p><p><b>Если слишком легко:</b> Убрать ворота и бонус.</p><p><b>Следите:</b> При жёлтом или красном сигнале матч заканчиваем сразу.</p></details><details><summary><b>Падающий мяч</b> · Подача (код П1)</summary><p><b>Зачем:</b> научиться начинать розыгрыш самой.</p><p><b>Приготовьте:</b> Стол, ракетка, мячик.</p><ol><li>Нина встаёт у короткого края стола. Ракетка в левой руке.</li><li>Правой рукой она берёт мячик, поднимает его на высоту груди над своей половиной стола, примерно перед собой чуть левее центра. Мячик лежит на раскрытой ладони.</li><li>Говорит «пуск!» и раскрывает пальцы. Мячик падает на стол и отскакивает вверх.</li><li>Когда мячик поднимается после отскока, Нина бьёт его ракеткой вперёд. Первые недели цель простая: чтобы мяч перелетел сетку.</li><li>Когда это получается, добавьте правило настоящей подачи: после удара мяч сначала касается её половины стола и только потом перелетает сетку (так на рисунке ниже).</li><li>10 попыток. Сначала считаем, сколько раз ракетка попала по мячу, потом сколько перелетело сетку, а позже сколько раз мяч сначала коснулся её половины стола.</li></ol><p><b>Что считаем:</b> Сколько из 10 перелетело сетку (позже: сколько раз мяч сначала коснулся её половины стола).</p><p><b>Если не получается:</b> Сначала только отпускать и ловить, потом добавить удар. Бить можно просто «толкая» мяч.</p><p><b>Если слишком легко:</b> Отпускать с чуть большей высоты. Добавить правило «сначала коснуться своей половины». Целиться в ворота.</p><p><b>Следите:</b> Обычная подача по правилам требует подброса минимум на 16 см свободной рукой. Для спортсменов с двигательными нарушениями возможны варианты, уточните у тренера и судьи.</p></details><details><summary><b>Подача с ракетки</b> · Подача (код П2)</summary><p><b>Зачем:</b> второй способ подачи, если подбросить правой рукой нельзя.</p><p><b>Приготовьте:</b> Стол, ракетка, мячик.</p><ol><li>Нина кладёт мячик на ракетку и держит её над своей половиной стола.</li><li>Приподнимает ракетку на 10–15 сантиметров, как в игре «Лифт». Мячик слегка подскакивает.</li><li>Когда мячик опускается, бьёт по нему ракеткой вперёд так, чтобы он сначала коснулся её половины стола, а потом перелетел сетку.</li><li>10 попыток.</li></ol><p><b>Что считаем:</b> Сколько из 10 перелетело сетку.</p><p><b>Если не получается:</b> Вернуться к игре «Лифт» и добавить удар позже. Если не получается, оставайтесь на «Падающем мяче».</p><p><b>Если слишком легко:</b> Целиться в ворота.</p><p><b>Следите:</b> Это более сложный способ. Не требуйте его, если с «Падающим мячом» получается лучше.</p></details><details><summary><b>Меткая подача</b> · Подача (код П3)</summary><p><b>Зачем:</b> научиться подавать в нужное место.</p><p><b>Приготовьте:</b> Стол, ракетка, мячи, ворота (два стакана) или цветные листы.</p><ol><li>Поставьте ворота или цветную зону на вашу половину стола.</li><li>Нина подаёт способом, который у неё получается лучше («Падающий мяч» или «Подача с ракетки»).</li><li>Цель: попасть в ворота или на названный цвет.</li><li>10 подач, считаем попадания.</li></ol><p><b>Что считаем:</b> Сколько из 10 подач попало в зону или ворота.</p><p><b>Если не получается:</b> Ворота шире, одна большая зона.</p><p><b>Если слишком легко:</b> Ворота уже, называть цвет перед каждой подачей.</p><p><b>Следите:</b> Не торопите, пусть сама выберет скорость.</p></details><details><summary><b>Ловим подачу</b> · Подача (код П4)</summary><p><b>Зачем:</b> научиться отвечать на подачу.</p><p><b>Приготовьте:</b> Стол, ракетка, мячи.</p><ol><li>Вы подаёте медленно и мягко: мяч один раз ударяется о вашу половину, потом об её.</li><li>Нина возвращает мяч на вашу половину.</li><li>Цель: 5 раз подряд вернуть мяч, не ронять ритм «приняла-вернула».</li><li>После каждой попытки скажите «молодец!», даже если не получилось.</li></ol><p><b>Что считаем:</b> Сколько раз подряд вернула из 5 попыток.</p><p><b>Если не получается:</b> Подавать в центр и очень медленно.</p><p><b>Если слишком легко:</b> Подавать в углы или на разные цвета.</p><p><b>Следите:</b> Подача простая, без вращения и скорости.</p></details><details><summary><b>Праздник</b> · Финал (код Ф1)</summary><p><b>Зачем:</b> закончить занятие радостью.</p><p><b>Приготовьте:</b> Ничего особенного, только хорошее настроение.</p><ol><li>Это 4 минуты свободной игры. Нина сама придумывает правила.</li><li>Примеры: играть двумя мячиками, танцевать после каждого очка, пройти до дивана с мячиком на ракетке.</li><li>Нина должна победить. Вы можете проиграть специально, она об этом не узнает.</li><li>В конце обнимите друг друга, поблагодарите мячик и поставьте звезду в таблице.</li></ol><p><b>Что считаем:</b> Ничего, просто радуемся.</p><p><b>Если не получается:</b> Если не хочется играть, просто обняться и спеть песенку.</p><p><b>Если слишком легко:</b> Придумать новую игру вместе.</p><p><b>Следите:</b> Закончите, пока ей ещё интересно.</p></details><details><summary><b>Дневник чемпионки</b> · Финал (код Ф2)</summary><p><b>Зачем:</b> помнить хорошее и учиться замечать свои успехи.</p><p><b>Приготовьте:</b> Стикеры, ручка.</p><ol><li>Спросите: «Что сегодня получилось лучше всего?»</li><li>Запишите ответ Нины одной фразой на полях страницы недели или нарисуйте вместе картинку.</li><li>Наклейте стикер или раскрасьте звезду.</li></ol><p><b>Что считаем:</b> Ничего, это не оценка.</p><p><b>Если не получается:</b> Если не знает, что ответить, предложите варианты: «Мяч летел высоко? Ты не сдалась?»</p><p><b>Если слишком легко:</b> Попросить придумать смешное название сегодняшнему дню.</p><p><b>Следите:</b> Хвалите за старание, а не только за результат.</p></details><details><summary><b>Мельница</b> · Разминка (код Р5)</summary><p><b>Зачем:</b> разогреть плечо игровой руки и корпус.</p><p><b>Приготовьте:</b> Свободное место 2 метра. Ракетка пока не нужна.</p><ol><li>Встаньте напротив Нины. Ноги чуть шире плеч, колени мягкие.</li><li>Левая рука рисует в воздухе большой круг вперёд, как крыло мельницы: 5 кругов вперёд, потом 5 назад. Круги плавные, без рывков.</li><li>Правая рука-помощница лежит на животе или держится за край стола. Если ей хочется, она тоже рисует маленький круг, но без усилия.</li><li>Левой рукой нарисуйте перед собой большую «восьмёрку» 3 раза.</li><li>Финал «Ветер»: Нина дует, и мельница сначала крутится быстро, потом медленно, пока не остановится.</li></ol><p><b>Что считаем:</b> Результат не считаем. Смотрим, что движение плавное, а плечо не поднято к уху.</p><p><b>Если не получается:</b> Круги поменьше, левая рука делает их у края стола.</p><p><b>Если слишком легко:</b> Взять в руку ракетку и крутить мельницу ею.</p><p><b>Следите:</b> Плечо не напряжено, нет рывков. Если в плече неприятно, сразу стоп.</p></details><details><summary><b>Тропинка</b> · Разминка (код Р6)</summary><p><b>Зачем:</b> ровный спокойный шаг и равновесие перед игрой у стола.</p><p><b>Приготовьте:</b> 8–10 листов бумаги («следы»), скотч, ровный нескользкий пол.</p><ol><li>Разложите листы по прямой «тропинкой». Расстояние между ними один небольшой шаг Нины. Приклейте скотчем, чтобы не скользили.</li><li>Нина идёт по тропинке и наступает на каждый след всей стопой. Начинает с левой ноги, руки свободны, смотрит вперёд.</li><li>Второй заход: начинает с правой ноги, шагает медленнее. Взрослый идёт рядом, но за руку не держит.</li><li>Третий заход: тропинка со змейкой, листы выложены с поворотами.</li><li>Финал «Статуя»: на последнем следе Нина замирает на 3 секунды.</li></ol><p><b>Что считаем:</b> Сколько следов прошла без остановки и сколько секунд простояла статуей.</p><p><b>Если не получается:</b> Следы ближе друг к другу, тропинка вдоль стены, чтобы можно было коснуться рукой.</p><p><b>Если слишком легко:</b> Нести на ракетке мячик (игра «Шарик на ложке») или называть вслух цвет каждого следа, на который наступает, или пройти тропинку с ракеткой в вытянутой руке. Глаза всегда открыты.</p><p><b>Следите:</b> Не просите «ровнее ходить» и не поправляйте походку. Задача только в спокойном темпе и безопасности.</p></details><details><summary><b>Шаг-приставка</b> · Разминка (код Р7)</summary><p><b>Зачем:</b> научиться подходить к мячу боком без прыжков.</p><p><b>Приготовьте:</b> Стол, два цветных стаканчика (красный и синий) на разных краях стола, место вдоль длинной стороны стола.</p><ol><li>Нина стоит у середины длинной стороны стола лицом к столу. Одной рукой держится за край стола.</li><li>Шаг вправо и приставить левую ногу, это один «шаг-приставка». Сделайте 3 шага вправо, потом 3 шага влево. Ступни почти не отрываются от пола, шаги небольшие.</li><li>Взрослый называет цвет: «красный». Нина делает шаг-приставку к красному стаканчику и касается его левой рукой.</li><li>Теперь без опоры на стол: Нина берёт ракетку и касается ею названного стаканчика.</li><li>Шесть касаний подряд, цвета называйте вперемешку.</li></ol><p><b>Что считаем:</b> Сколько касаний из 6 сделано с ровным дыханием и без потери равновесия.</p><p><b>Если не получается:</b> Держаться за стол, делать один шаг вместо трёх, стаканчики поставить ближе.</p><p><b>Если слишком легко:</b> Добавить мячик: шаг-приставка и лёгкий отбив мячика, который вы подали вбок.</p><p><b>Следите:</b> Никаких прыжков и скачков. В одну сторону шаг может быть увереннее, чем в другую: это нормально, не заставляйте. При заметной хромоте закончите блок.</p></details><details><summary><b>Шарик на ложке</b> · Мяч и ракетка (код М5)</summary><p><b>Зачем:</b> ровная рука, глаза на мяче, равновесие.</p><p><b>Приготовьте:</b> Ракетка, мячик, 2 подушки или мягкие игрушки как препятствия.</p><ol><li>Нина держит ракетку в левой руке, лопасть лежит ровно, как поднос.</li><li>Правая рука-помощница кладёт мячик в центр ракетки. Это её работа: положить и отпустить.</li><li>Идёт медленно 5 шагов, мячик не должен упасть.</li><li>Потом круг по комнате вокруг стула.</li><li>Если мячик упал, правая рука поднимает и кладёт снова. Когда пройден круг, обойдите подушки змейкой.</li></ol><p><b>Что считаем:</b> Сколько шагов или кругов без падения мячика. Запишите лучший результат.</p><p><b>Если не получается:</b> Взять крупный мяч или поролоновый шарик, ближе поставить цель, идти медленнее.</p><p><b>Если слишком легко:</b> Обойти препятствия змейкой, нести мячик в другую комнату.</p><p><b>Следите:</b> Рука с ракеткой не должна быть напряжена. Взрослый рядом, пол не скользкий.</p></details><details><summary><b>Двойной лифт</b> · Мяч и ракетка (код М6)</summary><p><b>Зачем:</b> учиться управлять ракеткой двумя сторонами и касаться мяча мягко.</p><p><b>Приготовьте:</b> Ракетка с накладкой с обеих сторон (или наклейка-стикер разных цветов на каждой стороне), мячик.</p><ol><li>Сначала вспомните «Лифт»: мячик лежит на ракетке, Нина подбивает его невысоко вверх.</li><li>Теперь ракетка делает так: «раз» одной стороной, мячик поймали, ракетку перевернули, «два» другой стороной.</li><li>Когда получается, убираем остановку: удар одной стороной, переворот ракетки в воздухе кистью, удар другой стороной.</li><li>Если мячик упал, правая рука-помощница берёт его и кладёт на ракетку. Ловить в воздухе правой не нужно.</li></ol><p><b>Что считаем:</b> Серия ударов подряд с чередованием сторон. Пять серий, запишите лучшую.</p><p><b>Если не получается:</b> Только два удара: одна сторона, потом другая, с остановкой. Взять мячик побольше.</p><p><b>Если слишком легко:</b> Увеличить высоту подбрасывания на ладонь или считать до 10.</p><p><b>Следите:</b> Левое запястье не должно болеть. Не торопите, лучше мало, но чисто.</p></details><details><summary><b>Мишени</b> · За столом (код С8)</summary><p><b>Зачем:</b> научиться целиться и управлять направлением.</p><p><b>Приготовьте:</b> Три цветных листа бумаги (красный, жёлтый, зелёный), скотч, корзина с мячами.</p><ol><li>Положите листы на вашу половину стола, как на рисунке, и приклейте.</li><li>Вы называете цвет: «красный!» (в начале недели можно называть один и тот же цвет).</li><li>Подавайте мяч Нине так же, как в «Гостях»: медленно, невысокой дугой, в одну и ту же точку.</li><li>Нина целится в названный цвет и отбивает.</li><li>Очки: попала в названный цвет 2 очка, попала в любой другой цвет 1 очко, мимо 0.</li></ol><p><b>Что считаем:</b> Сумму очков за 10 мячей. Две серии по 10 мячей, запишите лучшую.</p><p><b>Если не получается:</b> Один большой цвет, листы ближе к сетке, цвет называйте один и тот же.</p><p><b>Если слишком легко:</b> Листы поменьше или поставить стаканчик в центр: попасть в стаканчик 3 очка.</p><p><b>Следите:</b> Радуйтесь попаданию на стол. Не требуйте точности сразу: сначала на стол, потом в цвет.</p></details><details><summary><b>Длинная песенка</b> · За столом (код С9)</summary><p><b>Зачем:</b> держать мяч в игре дольше, расти в уверенности.</p><p><b>Приготовьте:</b> Стол с сеткой, 10–20 мячей, листок и ручка.</p><ol><li>Вы играете медленно: мяч идёт мягкой невысокой дугой и один раз отскакивает на половине Нины.</li><li>Нина возвращает мяч на вашу половину. Отбивайте мяч так, чтобы он ей снова подходил: ваши удары тоже мягкие и неторопливые.</li><li>Считайте вместе вслух каждый удар (и ваш, и Нинин): «раз, два, три…».</li><li>Когда мяч упал, ушёл мимо или не перелетел сетку, песенка закончилась. Начните сначала.</li><li>Пять песенок подряд. Запишите самую длинную.</li><li>Вариант «с шагом» (с 19-й недели): иногда отбивайте мяч чуть в сторону, так что Нине нужно сделать шаг-приставку.</li></ol><p><b>Что считаем:</b> Самая длинная серия из 5 попыток (сколько ударов вместе).</p><p><b>Если не получается:</b> Подавайте в одну и ту же точку, мяч покрупнее или помедленнее, цель на 2 удара меньше.</p><p><b>Если слишком легко:</b> Цель на 2 удара больше, добавить чуть разную высоту дуги.</p><p><b>Следите:</b> Взрослый не выигрывает у Нины, он её партнёр. Подстраивайтесь под её темп. Жёлтый сигнал усталости: заканчиваем.</p></details><details><summary><b>Ближний и дальний</b> · За столом (код С10)</summary><p><b>Зачем:</b> управлять длиной удара: ближе к сетке или дальше от неё.</p><p><b>Приготовьте:</b> Два листа: ближний возле сетки на вашей половине, дальний у вашего края стола, скотч, мячи.</p><ol><li>Положите листы, как на рисунке. Ближний возле сетки, дальний у края.</li><li>Вы называете: «ближний» или «дальний». Подаёте мяч Нине, как в «Гостях».</li><li>«Ближний»: Нина мягко подталкивает мяч, он падает у сетки.</li><li>«Дальний»: Нина отбивает чуть сильнее, мяч падает у вашего края.</li><li>10 мячей, потом смена: Нина называет, а вы угадываете, куда она хочет отправить.</li></ol><p><b>Что считаем:</b> Сколько мячей из 10 попало на названный лист.</p><p><b>Если не получается:</b> Начните с одного листа (ближнего), второй добавьте через неделю.</p><p><b>Если слишком легко:</b> Листы поменьше или назвать оба подряд: «ближний, дальний».</p><p><b>Следите:</b> Сила мягкая, большой замах не нужен. Если Нина расстраивается от промахов, возвращайтесь к «Гостям».</p></details><details><summary><b>Тихий мячик</b> · За столом (код С11)</summary><p><b>Зачем:</b> научиться мягкому касанию: мячик падает у сетки и почти не прыгает.</p><p><b>Приготовьте:</b> Лист бумаги возле сетки на вашей половине, мячи.</p><ol><li>Положите лист возле сетки на вашей половине стола.</li><li>Подавайте мяч Нине так же, как в «Гостях», но чуть ближе к сетке.</li><li>Нина «гладит» мяч ракеткой, как будто укладывает его спать: мяч должен упасть тихо возле сетки.</li><li>Попала на лист и мяч подпрыгнул невысоко: это «тихий мячик» и очко Нине.</li><li>10 мячей, потом смена: вы пробуете повторить тихий мячик на её половину.</li></ol><p><b>Что считаем:</b> Сколько «тихих мячиков» получилось из 10.</p><p><b>Если не получается:</b> Лист побольше, подавать мяч ещё ближе и медленнее, не требовать полной тишины.</p><p><b>Если слишком легко:</b> Лист меньше, добавить «тихий» после обычного удара: два мяча подряд.</p><p><b>Следите:</b> Не требуйте тишины любой ценой. Если Нина бьёт сильно, просто покажите: «Погладь, как котёнка».</p></details><details><summary><b>Игра с очками</b> · За столом (код С12)</summary><p><b>Зачем:</b> первый настоящий счёт и правила, как в большом настольном теннисе.</p><p><b>Приготовьте:</b> Стол с сеткой, мячи, листок со счётом (страница «Турнирный лист» в этой книге).</p><ol><li>Играем до 11 очков. Выигрывает тот, кто набрал 11 первым, но если счёт 10:10, играем дальше, пока не будет разницы в 2 очка.</li><li>Подача: два мяча подряд подаёт один, потом два мяча подряд другой. При счёте 10:10 подача меняется после каждого очка.</li><li>Очко получает тот, кто выиграл розыгрыш: соперник не вернул мяч на стол, мяч не перелетел сетку или упал мимо стола.</li><li>Если мяч при подаче задел сетку, но всё же упал на стол соперника, подачу повторяют (пересыл), очков никто не получает.</li><li>Перед каждой подачей вслух назовите счёт, сначала число подающего: «три-два».</li><li>Вы играете в полсилы. Иногда ошибайтесь, но не позволяйте Нине понять, что вы поддаётесь. После игры «дайте пять» левой ладошкой.</li></ol><p><b>Что считаем:</b> Очки. Каждую игру записывайте на «Турнирный лист».</p><p><b>Если не получается:</b> Играйте до 7 очков, Нине в начале даётся 3:0 преимущество, вы подаёте только мягко.</p><p><b>Если слишком легко:</b> Играть до 11 без преимущества, вам подавать чуть быстрее и в разные места.</p><p><b>Следите:</b> Усталость после долгой игры. Проигрыш это нормально: «Ничего, в следующий раз получится». Не меняйте правила посреди игры. Для настоящих соревнований правила для игроков с двигательными нарушениями уточните у тренера.</p></details><details><summary><b>Подача в угол</b> · Подача (код П5)</summary><p><b>Зачем:</b> подача, которая попадает туда, куда хочется.</p><p><b>Приготовьте:</b> Два листа разных цветов (красный и синий) в дальних углах вашей половины стола, мячи.</p><ol><li>Положите листы в дальние углы вашей половины, как на рисунке.</li><li>Нина подаёт «Падающим мячом» или «Подачей с ракетки». Помните правило: мяч сначала должен коснуться стола Нины, потом перелететь сетку.</li><li>Вы называете цвет угла: «красный!» (одинаковый цвет можно называть несколько мячей подряд).</li><li>Нина целится и подаёт. Попала в названный угол: 2 очка. Попала в другой угол или на лист: 1 очко. На стол: 0 очков, но «хорошо, что на стол!»</li><li>10 подач, потом отдых 30 секунд. Запишите.</li></ol><p><b>Что считаем:</b> Сколько подач из 10 попало в названный угол.</p><p><b>Если не получается:</b> Один большой лист, один и тот же цвет, листы ближе к центру.</p><p><b>Если слишком легко:</b> Листы поменьше, добавить третий угол.</p><p><b>Следите:</b> Не торопите подачу. Правая рука-помощница мягко отпускает мяч, а не бросает. Не заставляйте Нину подбрасывать мяч вверх.</p></details><details><summary><b>Подача-сюрприз</b> · Подача (код П6)</summary><p><b>Зачем:</b> подача разной длины: короткая у сетки и длинная у края.</p><p><b>Приготовьте:</b> Листы из «Ближнего и дальнего»: один у сетки, второй у края стола.</p><ol><li>Положите листы как в «Ближнем и дальнем».</li><li>Нина решает про себя: подам коротко или далеко, и подаёт.</li><li>Вы пытаетесь угадать, куда упадёт мяч, и говорите вслух до подачи.</li><li>Угадали: очко вам. Не угадали: очко Нине. Если подача не по правилам, повтор.</li><li>Дальше меняйтесь ролями: она угадывает вашу подачу.</li></ol><p><b>Что считаем:</b> Сколько подач из 10 попало туда, куда Нина задумала, и сколько раз вы не угадали.</p><p><b>Если не получается:</b> Подавайте только коротко или только далеко, потом добавляйте второй вариант.</p><p><b>Если слишком легко:</b> Нина называет вслух, куда подаст, перед подачей.</p><p><b>Следите:</b> Подача по правилам (сначала свой стол). Не позволяйте игре превратиться в спор об очках.</p></details><details><summary><b>Счёт и подача</b> · Подача (код П7)</summary><p><b>Зачем:</b> научиться играть розыгрыш от подачи до очка и считать подачи.</p><p><b>Приготовьте:</b> Стол с сеткой, мячи, счёт-листок.</p><ol><li>Подаёт Нина. Вы принимаете.</li><li>Играйте розыгрыш до ошибки. Победитель получает очко.</li><li>После двух подач подряд очередь меняется: теперь подаёте вы две подачи.</li><li>Перед каждой подачей вслух называйте счёт: «Нина три, взрослый два».</li><li>Сделайте 10 розыгрышей и посчитайте, сколько выиграла Нина.</li></ol><p><b>Что считаем:</b> Сколько розыгрышей из 10 выиграла Нина.</p><p><b>Если не получается:</b> Нина подаёт каждый раз, пока привыкает.</p><p><b>Если слишком легко:</b> Добавить подачи в угол (из «Подачи в угол»).</p><p><b>Следите:</b> Нина должна успевать отдохнуть между розыгрышами. Не делайте больше 10 розыгрышей подряд.</p></details><details><summary><b>Карточка героя</b> · Финал (код Ф3)</summary><p><b>Зачем:</b> учиться выбирать хитрость и спокойно играть по плану.</p><p><b>Приготовьте:</b> Вырезанные карточки со страницы «Карточки героя» в этой книге, коробочка.</p><ol><li>Вырежьте карточки и перемешайте их лицом вниз.</li><li>Нина вытягивает одну карточку. Это задание героя на финальную игру.</li><li>Во время игры вы вместе стараетесь выполнить задание. Если удалось хотя бы раз, звёздочка.</li><li>После игры вспомните: что получилось, что было сложно, что попробуем в следующий раз.</li><li>Положите выполненную карточку в коробочку героя.</li></ol><p><b>Что считаем:</b> Сколько карточек выполнено за неделю.</p><p><b>Если не получается:</b> Давайте самые лёгкие карточки (улыбка, дыхание).</p><p><b>Если слишком легко:</b> Нина придумывает свою карточку героя и рисует её.</p><p><b>Следите:</b> Не превращайте карточки в экзамен. Это игра: карточка не получилась, значит, вытянем другую.</p></details></div></noscript>

 мягко поднимается на носочки. Никаких прыжков: слабую стопу не подворачиваем.", "Слон. Идём медленно, с широкими шагами, руки как хобот. Правая рука делает только то, что у неё получается, без усилий.", "На каждое «животное» уходит около 30 секунд. Рычим, трубим, смешим друг друга."], "count": "Ничего, главное весело и безопасно.", "hard": "Держаться за стол обеими руками, пружинки делать неглубоко, цаплю делать у стены.", "easy": "Цапля с мячом, лежащим на ракетке.", "watch": "Пол не скользкий, взрослый стоит рядом, но не хватает за руку внезапно."}, "Р2": {"n": "Ловкая помощница", "k": "Р", "why": "научить правую руку брать и отпускать: это основа подачи", "prep": "Две миски, 10 шариков или помпонов, мягкий мячик-антистресс, один стаканчик.", "steps": ["Шарики. Поставьте две миски рядом на стол, в одной 10 шариков. Нина берёт правой рукой по одному шарику и перекладывает в пустую миску. Если не получается, подождите 5 секунд, потом помогите левой рукой. Не торопите.", "Сжимаем. Нина сжимает мягкий мячик правой рукой и отпускает, 10 раз. Считайте вместе.", "Пуск! Нина берёт мячик правой рукой, держит его над стаканчиком на высоте своей ладони и по команде «пуск!» раскрывает пальцы. Мячик должен упасть в стаканчик."], "count": "Сколько шариков переложено за минуту. Запишите и сравнивайте с прошлой неделей.", "hard": "Взять предметы побольше: кубики, мягкие игрушки.", "easy": "Предметы поменьше, на время «против себя вчерашней».", "watch": "Не превращайте игру в гонку с кем-то. При усталости или боли сразу стоп (светофор). Упражнения для правой руки согласуйте с физиотерапевтом."}, "Р3": {"n": "Растяжка-сказка", "k": "Р", "why": "снять скованность и подготовить мышцы", "prep": "Коврик или ковёр. Упражнения, которые показал физиотерапевт (спросите его заранее).", "steps": ["Попросите физиотерапевта показать 3–4 растяжки для плеча, кисти и голеностопа и впишите их в таблицу ниже.", "Нина садится или ложится удобно. Вы рассказываете короткую сказку (2 минуты), а она в function lsGet() { try { return JSON.parse(localStorage.getItem("nina-progress") || "null"); } catch (e) { return null; } }
function lsSet(j) { try { localStorage.setItem("nina-progress", j); return true; } catch (e) { return false; } }

async function flush() {

      if (d.json === JSON.stringify(state) || store.writing) return;

    }, () => { store.ref = null; });

});
document.addEventListener("change", (e) => {
  if (e.target.id === "startDate") { state.start[ui.book] = e.target.value; touch("start", ui.book); save(); render(); }
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset && e.target.dataset.rec; if (k) { state.rec[k] = e.target.value; touch("rec", k); save(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) cloudSync(); });
setInterval(cloudSync, 30000);
(function init() {
  // выбрать книгу и неделю по дате старта, если она сохранена позже
  initStore().then(() => {
    for (const b of [2, 1]) { const t = todayInfo(b); if (t && !t.out) { ui.book = b; ui.week[b] = t.wk; break; } }
    render(); cloudSync();
  });
})();
</script>
</body></html>
